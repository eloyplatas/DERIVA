name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev libxi-dev libfreetype-dev libfontconfig1-dev libasound2-dev

      - name: Offline DSP tests (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build_test
          g++ -std=c++17 -O2 -o build_test/engine_test tests/engine_test.cpp
          ./build_test/engine_test
          MI=ThirdParty/mi
          g++ -std=c++17 -O2 -DTEST -D_USE_MATH_DEFINES -I$MI -IThirdParty/r8brain -w -o build_test/beads_test tests/beads_test.cpp \
            Source/dsp/BeadsUnit.cpp $MI/beads/dsp/processor.cc $MI/beads/dsp/mu_law.cc $MI/beads/dsp/delay_clock.cc \
            $MI/beads/dsp/delay_controller.cc $MI/beads/dsp/trigger_generator.cc $MI/beads/resources.cc \
            $MI/stmlib/utils/random.cc $MI/stmlib/dsp/units.cc
          ./build_test/beads_test

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          else
            cmake -B build
          fi

      - name: Build VST3
        run: cmake --build build --config Release --target Deriva_VST3 --parallel 4

      - name: Package
        shell: bash
        run: |
          VERSION=$(grep -oE 'project\(Deriva VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')
          mkdir -p dist/pkg/licenses
          cp -R build/Deriva_artefacts/Release/VST3/Deriva.vst3 dist/pkg/
          if [ "$RUNNER_OS" == "macOS" ]; then
            codesign --force --deep --sign - dist/pkg/Deriva.vst3
            lipo -info dist/pkg/Deriva.vst3/Contents/MacOS/Deriva
          fi
          if [ "$RUNNER_OS" == "Linux" ]; then
            strip --strip-unneeded dist/pkg/Deriva.vst3/Contents/x86_64-linux/Deriva.so
            echo "glibc symbols needed:"; objdump -T dist/pkg/Deriva.vst3/Contents/x86_64-linux/Deriva.so | grep -o 'GLIBC_[0-9.]*' | sort -t. -k2 -n -u | tail -1
          fi
          cp Resources/fonts/OFL.txt dist/pkg/licenses/OFL-Montserrat.txt
          cp ThirdParty/mi/LICENSE-stmlib.txt dist/pkg/licenses/MIT-Beads-stmlib.txt
          cp ThirdParty/r8brain/LICENSE dist/pkg/licenses/MIT-r8brain.txt
          cp docs/manual/*.pdf dist/pkg/ 2>/dev/null || true
          cd dist/pkg
          cmake -E tar cf ../Deriva-$VERSION-${{ matrix.name }}-vst3.zip --format=zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Deriva-${{ matrix.name }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            docs/manual/*.pdf
